name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hynek/setup-cached-uv@v2
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest --cov=backlog --cov-report=term
