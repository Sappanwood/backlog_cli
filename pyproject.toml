[project]
name = "backlog-cli"
version = "0.1.0"
description = "Unified backlog manager for project task tracking"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-frontmatter>=1.1",
]

[project.scripts]
backlog = "backlog.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/backlog"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
