[project]
name = "backlog-cli"
version = "0.1.0"
description = "Unified backlog manager for project task tracking"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-frontmatter>=1.1",
]

[project.scripts]
backlog = "backlog.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/backlog"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/backlog/cli.py" = ["B008"]
"tests/*" = ["B008", "F841", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/backlog"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
